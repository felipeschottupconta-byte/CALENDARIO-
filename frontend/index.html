<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Preview · RN Contabilidade</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html,body{margin:0;background:#111}
  .trocador{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));
    z-index:9999;display:flex;gap:5px;font-family:system-ui,sans-serif}
  .trocador button{padding:6px 9px;border-radius:7px;border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#eee;font-weight:600;font-size:10.5px;
    cursor:pointer}
  .trocador button.on{background:#fff;color:#000;border-color:#fff}
  #status{display:none}
</style>
</head>
<body>
  <div class="trocador">
    <button id="btn-cliente" onclick="mostrar('cliente')">App Cliente</button>
    <button id="btn-painel" onclick="mostrar('painel')">Painel de publicação</button>
  </div>
  <div id="status">carregando…</div>
  <div id="root"></div>

  <script>
    const cache = {};
    const root = ReactDOM.createRoot(document.getElementById('root'));
    const status = document.getElementById('status');

    async function carregar(arquivo, nomeComponente) {
      if (cache[arquivo]) return cache[arquivo];
      const res = await fetch(arquivo);
      if (!res.ok) throw new Error('Não achei ' + arquivo + ' — rode este preview a partir da pasta frontend/.');
      let src = await res.text();
      src = src.replace(/^import .*$/gm, '');
      src = src.replace('export default function App', 'function ' + nomeComponente);
      const codigo = Babel.transform(src, { presets: ['react'] }).code;
      const factory = new Function('React', 'useState', 'useMemo', codigo + '\nreturn ' + nomeComponente + ';');
      const Componente = factory(React, React.useState, React.useMemo);
      cache[arquivo] = Componente;
      return Componente;
    }

    async function mostrar(qual) {
      document.getElementById('btn-cliente').classList.toggle('on', qual === 'cliente');
      document.getElementById('btn-painel').classList.toggle('on', qual === 'painel');
      status.textContent = 'carregando…';
      try {
        const Componente = qual === 'cliente'
          ? await carregar('app-cliente.jsx', 'AppCliente')
          : await carregar('painel-publicacao.jsx', 'AppPainel');
        root.render(React.createElement(Componente));
        status.textContent = qual === 'cliente' ? 'App Cliente — clique em Entrar' : 'Painel de publicação';
      } catch (err) {
        status.textContent = 'Erro: ' + err.message;
        console.error(err);
      }
    }

    mostrar('cliente');
  </script>
</body>
</html>
